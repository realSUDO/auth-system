services: 
  postgres: 
    image : postgres:16
    container_name : auth_postgres
    environment : 
      POSTGRES_USER : sudoauth
      POSTGRES_PASSWORD : lolauth
      POSTGRES_DB : lolauthDB

    ports  :
      - "5432:5432"
    volumes : 
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sudoauth"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
